name: Desktop CI

on:
  push:
    branches: [main]
    paths:
      - desktop/**
      - .github/workflows/desktop-ci.yml
  pull_request:
    paths:
      - desktop/**
      - .github/workflows/desktop-ci.yml

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install app dependencies
        shell: bash
        working-directory: desktop
        run: |
          set -euo pipefail
          npm ci
      - name: Build frontend
        shell: bash
        working-directory: desktop
        run: |
          set -euo pipefail
          npm run build
      - name: Run frontend tests
        shell: bash
        working-directory: desktop
        run: |
          set -euo pipefail
          npm test
      - name: Run Rust tests
        shell: bash
        working-directory: desktop/src-tauri
        run: |
          set -euo pipefail
          cargo test --lib