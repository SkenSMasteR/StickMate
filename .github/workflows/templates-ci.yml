name: Templates CI

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out validator
        uses: actions/checkout@v7
        with:
          ref: main
          path: source
      - name: Check out template catalog
        uses: actions/checkout@v7
        with:
          ref: templates
          path: content
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test the validator
        run: python -m unittest discover -s source/scripts -p "test_*.py" -v
      - name: Validate published templates
        run: python source/scripts/validate-templates.py content
      - name: Verify catalog is reachable
        shell: bash
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/SkenSMasteR/StickMate/templates/catalog.json"
          curl --fail --silent --show-error "$url" -o "$RUNNER_TEMP/catalog.json"
          expected="$(sha256sum content/catalog.json | cut -d ' ' -f 1)"
          actual="$(sha256sum "$RUNNER_TEMP/catalog.json" | cut -d ' ' -f 1)"
          if [ "$actual" != "$expected" ]; then
            echo "catalog at $url does not match the templates branch"
            exit 1
          fi
          echo "catalog matches $url"